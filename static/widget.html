<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nimbus Support</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --me:#2563eb; --bot:#334155; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,sans-serif; background:var(--bg);
         color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px; background:var(--card); font-weight:600; border-bottom:1px solid #334155; }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 12px; border-radius:12px; line-height:1.45; white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  .cites { font-size:12px; color:#93c5fd; margin-top:8px; }
  form { display:flex; gap:8px; padding:12px; background:var(--card); border-top:1px solid #334155; }
  input { flex:1; padding:10px; border-radius:8px; border:1px solid #475569; background:#0f172a; color:var(--text); }
  button { padding:10px 16px; border:0; border-radius:8px; background:var(--me); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  footer { font-size:11px; color:var(--muted); text-align:center; padding:6px 10px; }
</style>
</head>
<body>
  <header>Nimbus Support Assistant</header>
  <div id="log">
    <div class="msg bot">Hi! Ask me anything about Nimbus: billing, security, integrations, or troubleshooting.</div>
  </div>
  <form id="f">
    <input id="q" placeholder="Type your question..." autocomplete="off" required aria-label="Your question">
    <button id="send">Send</button>
  </form>
  <footer>Answers are AI-generated from Nimbus docs. Verify important details.</footer>
<script>
const log = document.getElementById('log');
const form = document.getElementById('f');
const input = document.getElementById('q');
const btn = document.getElementById('send');

function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  add(q, 'me');
  input.value = '';
  btn.disabled = true;
  const bubble = add('...', 'bot');
  try {
    // Relative URL so the widget works embedded under any path.
    const r = await fetch('chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q })
    });
    const data = await r.json();
    bubble.textContent = data.answer || '(no answer)';
    if (data.citations && data.citations.length) {
      const c = document.createElement('div');
      c.className = 'cites';
      c.textContent = 'Sources: ' + data.citations.map(x => '[' + x.marker + '] ' + x.source).join('   ');
      bubble.appendChild(c);
    }
  } catch (err) {
    bubble.textContent = 'Error reaching the server.';
  } finally {
    btn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
